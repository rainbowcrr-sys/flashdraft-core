name: core-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FlashDraft.sln
      - name: Build
        run: dotnet build FlashDraft.sln -c Release --no-restore
      - name: Test
        run: dotnet test FlashDraft.sln -c Release --no-build --logger "console;verbosity=normal"
